name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit and integration tests
        run: cargo test --verbose

      - name: Build codelog CLI
        run: cargo build --release

      - name: Run codelog test on codelog files
        run: |
          if [ -d "codelog" ] && [ -n "$(ls -A codelog/*.md 2>/dev/null)" ]; then
            ./target/release/codelog test codelog/*.md
          else
            echo "No codelog files found in codelog/ to test."
          fi
