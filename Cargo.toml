[package]
name = "codelog"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "A Rust CLI tool designed to test, apply, and review patch-based Markdown logs (codelogs)."

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
pulldown-cmark = "0.10"
tempfile = "3.8"
anstream = "0.6"
anstyle = "0.3"
termimad = "0.30"
anyhow = "1.0"
thiserror = "1.0"
